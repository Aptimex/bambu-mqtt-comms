[build-system]
requires = ["setuptools>=77.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "bambu-mqtt-comms"
dynamic = ["version"]
description = "MQTT communication library for Bambu Lab printers"
readme = "README.md"
requires-python = ">=3.8"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Aptimex" }]
keywords = ["bambu", "bambu-lab", "mqtt", "3d-printing", "ams"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "paho-mqtt>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Aptimex/bambu-mqtt-comms"
Repository = "https://github.com/Aptimex/bambu-mqtt-comms"
Issues = "https://github.com/Aptimex/bambu-mqtt-comms/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bambu_mqtt_comms*"]

[tool.setuptools_scm]
# Version comes from the latest git tag (e.g. v0.2.0 -> 0.2.0). Untagged commits
# build as dev versions like 0.2.1.dev3; drop the +g<hash> suffix since PyPI
# and TestPyPI reject local versions.
local_scheme = "no-local-version"
